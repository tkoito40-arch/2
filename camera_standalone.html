<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="黒板カメラ">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest_camera.json">
<title>電子黒板カメラ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:'Meiryo UI',Meiryo,'Hiragino Sans',sans-serif;}
body{display:flex;flex-direction:column;}
.screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.hidden{display:none!important;}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;gap:8px;
  padding:max(env(safe-area-inset-top),12px) 14px 10px;
  background:#111;flex-shrink:0;}
.hdr h1{flex:1;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-btn{background:#222;border:1px solid #333;color:#ccc;padding:6px 12px;
  border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}

/* ── SHARED BODY ── */
.body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.btn-new{width:100%;padding:15px;background:#1565C0;border:none;border-radius:12px;
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-new:active{background:#0D47A1;}
.btn-go{width:100%;padding:14px;background:#1565C0;border:none;border-radius:10px;
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-go:disabled{opacity:.3;}
.btn-sec{width:100%;padding:12px;background:#1a1a1a;border:1px solid #2a2a2a;
  border-radius:10px;color:#aaa;font-size:14px;font-family:inherit;cursor:pointer;}
.sec-label{font-size:11px;font-weight:700;color:#555;letter-spacing:.5px;text-transform:uppercase;}
.empty-msg{color:#444;font-size:14px;text-align:center;padding:24px;}
.field label{display:block;font-size:10px;font-weight:700;color:#555;
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;}
.field input{width:100%;padding:11px 13px;background:#151515;border:1px solid #252525;
  border-radius:10px;color:#fff;font-size:15px;font-family:inherit;-webkit-appearance:none;}
.field input:focus{outline:none;border-color:#1565C0;}
.hint{font-size:11px;color:#444;margin-top:4px;}

/* ── HOME: 案件カード ── */
.proj-card{background:#151515;border:1px solid #222;border-radius:10px;
  display:flex;align-items:center;cursor:pointer;}
.proj-card:active{background:#1a2040;}
.proj-info{flex:1;padding:13px 14px;min-width:0;}
.proj-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-sub{font-size:12px;color:#555;margin-top:3px;}
.proj-arrow{padding:0 16px;color:#444;font-size:20px;}
.proj-del{padding:0 14px;color:#555;font-size:18px;cursor:pointer;border:none;background:transparent;}

/* ── PROJECT: グループセクション ── */
.group-section{border:1px solid #222;border-radius:10px;overflow:hidden;background:#0d0d0d;}
.group-hdr{display:flex;align-items:center;background:#1a1a1a;padding:10px 14px;gap:8px;}
.group-hdr-name{flex:1;font-size:14px;font-weight:700;color:#fff;}
.icon-btn{background:transparent;border:none;color:#555;font-size:17px;cursor:pointer;padding:4px 8px;}
.icon-btn:active{color:#fff;}
.proc-row{display:flex;flex-wrap:wrap;align-items:center;
  padding:9px 14px;border-top:1px solid #1a1a1a;gap:6px;}
.proc-row-top{display:flex;align-items:center;width:100%;gap:8px;}
.proc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#333;transition:background .2s;}
.proc-dot.done{background:#43A047;}
.proc-name{flex:1;font-size:14px;color:#ccc;}
.proc-cnt{font-size:11px;color:#43A047;font-weight:700;white-space:nowrap;}
.shoot-btn{background:#1565C0;border:none;color:#fff;padding:6px 14px;border-radius:6px;
  font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.shoot-btn:active{background:#0D47A1;}
.proc-thumbs{display:flex;gap:4px;width:100%;flex-wrap:wrap;}
.proc-thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;
  cursor:pointer;border:1.5px solid #333;flex-shrink:0;}
.proc-thumb:active{opacity:.7;}
.proc-thumb-more{width:52px;height:52px;border-radius:6px;background:#1a1a1a;
  border:1.5px solid #333;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#888;cursor:pointer;flex-shrink:0;}

/* ── LIGHTBOX ── */
.lightbox{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.lb-bg{position:absolute;inset:0;background:rgba(0,0,0,.93);}
.lb-img{position:relative;max-width:100%;max-height:80vh;object-fit:contain;z-index:1;
  display:block;}
.lb-close{position:absolute;top:max(env(safe-area-inset-top),14px);right:14px;
  background:rgba(0,0,0,.6);border:1.5px solid #555;color:#fff;
  width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer;z-index:2;
  display:flex;align-items:center;justify-content:center;font-family:inherit;}
.lb-bar{position:absolute;bottom:max(env(safe-area-inset-bottom),16px);left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:20px;z-index:2;}
.lb-nav-btn{background:rgba(0,0,0,.5);border:1.5px solid #555;color:#fff;
  width:46px;height:46px;border-radius:50%;font-size:26px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;}
.lb-nav-btn:disabled{opacity:.2;}
.lb-count{color:#aaa;font-size:14px;min-width:52px;text-align:center;}
.lb-proc{position:absolute;top:max(env(safe-area-inset-top),14px);left:14px;
  background:rgba(21,101,192,.85);padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:700;color:#fff;z-index:2;max-width:65%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── GROUP EDIT ── */
.preset-tabs{display:flex;gap:7px;flex-wrap:wrap;}
.preset-tab{padding:7px 13px;background:#1a1a1a;border:1.5px solid #333;
  border-radius:20px;color:#888;font-size:13px;cursor:pointer;font-family:inherit;}
.preset-tab:active{background:#1565C0;border-color:#1565C0;color:#fff;}
.proc-edit-list{display:flex;flex-direction:column;gap:2px;}
.proc-edit-row{display:flex;align-items:center;background:#151515;border-radius:8px;
  padding:9px 12px;gap:8px;}
.proc-edit-name{flex:1;font-size:14px;color:#ccc;}
.proc-del-btn{background:transparent;border:none;color:#555;font-size:16px;cursor:pointer;padding:2px 6px;}
.proc-drag-handle{color:#444;font-size:20px;cursor:grab;padding:2px 10px 2px 4px;
  touch-action:none;user-select:none;-webkit-user-select:none;flex-shrink:0;}
.proc-edit-row.is-dragging{opacity:.4;background:#222;}
.proc-edit-row.drag-over-top{border-top:2px solid #42A5F5;}
.proc-edit-row.drag-over-bot{border-bottom:2px solid #42A5F5;}
.add-proc-row{display:flex;gap:8px;}
.add-proc-row input{flex:1;padding:10px 12px;background:#151515;border:1px solid #252525;
  border-radius:8px;color:#fff;font-size:14px;font-family:inherit;-webkit-appearance:none;}
.add-proc-row input:focus{outline:none;border-color:#1565C0;}
.add-proc-btn{background:#2E7D32;border:none;color:#fff;padding:10px 16px;
  border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap;}

/* ── BB PREVIEW ── */
.bb-preview-wrap{width:70%;margin:0 auto;}
.bb-frame{background:#1A5C1A;border:2.5px solid #fff;border-radius:2px;overflow:hidden;
  display:flex;flex-direction:column;aspect-ratio:4/3;}
.bb-table{width:100%;border-collapse:collapse;flex-shrink:0;}
.bb-table td{border:1px solid #fff;padding:5px 8px;font-size:11px;color:#fff;}
.bb-table .bl{width:50px;white-space:nowrap;}
.bb-table .bv{font-weight:700;}
.bb-proc-area{flex:1;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;padding:5px;text-align:center;
  border-top:1px solid #fff;word-break:break-all;line-height:1.3;font-size:13px;}

/* ── CAMERA SCREEN ── */
.cam-top{display:flex;align-items:center;gap:8px;
  padding:max(env(safe-area-inset-top),10px) 14px 8px;
  background:rgba(0,0,0,.78);backdrop-filter:blur(10px);flex-shrink:0;cursor:pointer;}
.cam-name{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cam-proc{font-size:12px;color:#42A5F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;}
.cam-edit{font-size:11px;color:#555;white-space:nowrap;}
.viewfinder{position:relative;flex:1;background:#000;overflow:hidden;}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.bb-ov{position:absolute;bottom:10px;left:10px;width:48%;z-index:5;
  aspect-ratio:4/3;background:#1A5C1A;border:2px solid #fff;border-radius:2px;
  opacity:.92;cursor:grab;touch-action:none;display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;}
.bb-ov:active{cursor:grabbing;}
.bb-ov .bb-table{flex-shrink:0;}
.bb-ov .bb-proc-area{border-top:1px solid #fff;}
.fallback-area{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:10;}
.fallback-area p{font-size:14px;color:#aaa;text-align:center;}
.fallback-label{display:flex;align-items:center;justify-content:center;
  width:150px;height:150px;border-radius:50%;background:#1565C0;
  font-size:15px;font-weight:700;cursor:pointer;text-align:center;line-height:1.5;}
#fileCap,#fileAlb2,#fileAlb{display:none;}
.album-label{font-size:13px;color:#555;cursor:pointer;text-decoration:underline;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;}
@keyframes flashAnim{0%{opacity:.9}100%{opacity:0}}
.cam-bar{display:flex;align-items:center;justify-content:space-around;
  padding:16px 32px max(env(safe-area-inset-bottom),20px);
  background:rgba(0,0,0,.85);flex-shrink:0;}
.cam-icon{width:54px;height:54px;border-radius:50%;background:#222;
  border:1.5px solid #444;font-size:20px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;position:relative;
  user-select:none;-webkit-user-select:none;}
.gal-badge{position:absolute;top:-4px;right:-4px;background:#F44336;color:#fff;
  font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:18px;text-align:center;}
.shutter-ring{width:76px;height:76px;border-radius:50%;border:3px solid #fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  user-select:none;-webkit-user-select:none;}
.shutter-inner{width:62px;height:62px;border-radius:50%;background:#fff;
  transition:transform .1s,background .1s;}
.shutter-ring:active .shutter-inner{background:#ccc;transform:scale(.9);}

/* ── GALLERY ── */
.gal-hdr{display:flex;align-items:center;gap:8px;
  padding:max(env(safe-area-inset-top),12px) 14px 10px;
  background:#111;flex-shrink:0;}
.gal-hdr h1{flex:1;font-size:15px;font-weight:700;}
.gal-hdr button{background:#222;border:1px solid #333;color:#aaa;
  padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;}
.gal-hdr .dl-all{background:#2E7D32;border-color:#2E7D32;color:#fff;}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;background:#000;}
.gal-item{position:relative;aspect-ratio:1;background:#111;overflow:hidden;}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block;}
.gal-dl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);
  padding:5px 0;text-align:center;font-size:12px;color:#fff;cursor:pointer;}
.gal-proc{position:absolute;top:0;left:0;right:0;background:rgba(21,101,192,.8);
  padding:3px 5px;font-size:10px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gal-empty{flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;color:#444;padding:40px;}
.gal-empty span{font-size:52px;}
.gal-foot{padding:12px 16px max(env(safe-area-inset-bottom),12px);
  background:#111;flex-shrink:0;}
.del-btn{width:100%;padding:12px;border-radius:10px;font-size:14px;
  font-family:inherit;cursor:pointer;background:transparent;
  border:1px solid #F44336;color:#F44336;}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:flex-end;}
.modal{background:#1a1a1a;border-radius:20px 20px 0 0;
  padding:20px 20px max(env(safe-area-inset-bottom),20px);
  width:100%;display:flex;flex-direction:column;gap:12px;}
.modal h2{font-size:16px;font-weight:700;text-align:center;}
.modal .field input{background:#111;border-color:#333;}
.modal-btn{width:100%;padding:13px;border:none;border-radius:10px;
  font-size:15px;font-family:inherit;cursor:pointer;}
.modal-save{background:#1565C0;color:#fff;}
.modal-cancel{background:#2a2a2a;color:#aaa;}

/* ── TOAST / LOADER ── */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
  left:50%;transform:translateX(-50%);background:#333;color:#fff;
  padding:11px 22px;border-radius:24px;font-size:14px;font-weight:600;
  white-space:nowrap;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.loader{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:300;}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ████ HOME: 案件一覧 ████ -->
<div class="screen" id="sHome">
  <div class="hdr">
    <h1>📷 電子黒板カメラ</h1>
    <button class="hdr-btn" onclick="showGallery('home')">🖼 <span id="homGalCnt">0</span>枚</button>
    <button class="hdr-btn" onclick="openSettings()">⚙</button>
  </div>
  <div class="body">
    <button class="btn-new" onclick="addProject()">＋ 新しい案件を追加</button>
    <div class="sec-label">案件一覧</div>
    <div id="projList"></div>
    <div class="empty-msg hidden" id="projEmpty">案件がありません</div>
  </div>
</div>

<!-- ████ PROJECT: 案件詳細 ████ -->
<div class="screen hidden" id="sProject">
  <div class="hdr">
    <button class="hdr-btn" onclick="showHome()">← 戻る</button>
    <h1 id="projTitle"></h1>
    <button class="hdr-btn" onclick="editProjectName()">✏</button>
    <button class="hdr-btn" onclick="addGroup()">＋</button>
  </div>
  <div class="body">
    <div id="groupList"></div>
    <div class="empty-msg hidden" id="groupEmpty">工事件名がありません</div>
  </div>
</div>

<!-- ████ GROUP DETAIL: 工種一覧 ████ -->
<div class="screen hidden" id="sGroupDetail">
  <div class="hdr">
    <button class="hdr-btn" onclick="showProject()">← 戻る</button>
    <h1 id="gdTitle"></h1>
    <button class="hdr-btn" onclick="editGroupFromDetail()">✏</button>
  </div>
  <div class="body" id="gdBody"></div>
</div>

<!-- ████ GROUP EDIT: グループ編集 ████ -->
<div class="screen hidden" id="sGroupEdit">
  <div class="hdr">
    <button class="hdr-btn" onclick="cancelGroupEdit()">← 戻る</button>
    <h1 id="geTitle">グループを追加</h1>
  </div>
  <div class="body">
    <div class="field">
      <label>工事件名（黒板に表示される名前）</label>
      <input type="text" id="groupNameInp" placeholder="例：○○県○○1丁目給水管工事">
    </div>
    <div class="field">
      <label>テンプレートから一括読み込み</label>
      <div class="preset-tabs">
        <button class="preset-tab" onclick="loadPreset(0)">給水（東京都）</button>
        <button class="preset-tab" onclick="loadPreset(1)">給水（神奈川県）</button>
        <button class="preset-tab" onclick="loadPreset(2)">下水道工事</button>
        <button class="preset-tab" onclick="loadPreset(3)">桝交換</button>
      </div>
      <div class="hint">タップすると下の工種リストが自動入力されます</div>
    </div>
    <div class="field">
      <label>工種リスト</label>
      <div class="proc-edit-list" id="procEditList"></div>
      <div class="add-proc-row" style="margin-top:8px">
        <input type="text" id="addProcInp" placeholder="工種を入力して追加" list="procDL2">
        <datalist id="procDL2"></datalist>
        <button class="add-proc-btn" onclick="addProcItem()">＋ 追加</button>
      </div>
    </div>
    <button class="btn-go" onclick="saveGroup()">💾 工事件名を保存</button>
  </div>
</div>

<!-- ████ CAMERA ████ -->
<div class="screen hidden" id="sCam">
  <div class="cam-top" onclick="backFromCam()">
    <span class="cam-name" id="cName"></span>
    <span class="cam-proc" id="cProc"></span>
    <span class="cam-edit">▼ 戻る</span>
  </div>
  <div class="viewfinder" id="viewfinder">
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="bb-ov" id="bbOv">
      <table class="bb-table">
        <tr><td class="bl">工事名</td><td class="bv" id="ov_n"></td></tr>
        <tr><td class="bl">撮影日</td><td class="bv" id="ov_d"></td></tr>
      </table>
      <div class="bb-proc-area" id="ov_p"></div>
    </div>
    <div class="fallback-area hidden" id="fallbackArea">
      <p>カメラを起動するには<br>下のボタンをタップ</p>
      <label class="fallback-label" for="fileCap">📷<br>撮影する</label>
      <input type="file" id="fileCap" accept="image/*" capture="environment" onchange="onCapFile(event)">
      <label class="album-label" for="fileAlb2">アルバムから選ぶ</label>
      <input type="file" id="fileAlb2" accept="image/*" onchange="onCapFile(event)">
    </div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="cam-bar">
    <div class="cam-icon" onclick="showGallery('cam')">
      🖼<span class="gal-badge" id="galBadge">0</span>
    </div>
    <div class="shutter-ring" onclick="shoot()">
      <div class="shutter-inner"></div>
    </div>
    <div class="cam-icon" onclick="flipCam()">🔄</div>
  </div>
</div>

<!-- ████ GALLERY ████ -->
<div class="screen hidden" id="sGal">
  <div class="gal-hdr">
    <button onclick="backFromGallery()">← 戻る</button>
    <h1>写真（<span id="galTotal">0</span>枚）</h1>
    <button class="dl-all" onclick="downloadAll()">⬇ 一括</button>
  </div>
  <div id="galContent" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;"></div>
  <div class="gal-foot">
    <button class="del-btn" onclick="clearAll()">🗑 全て削除</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox">
  <div class="lb-bg" onclick="closeLightbox()"></div>
  <div class="lb-proc" id="lbProc"></div>
  <img class="lb-img" id="lbImg" src="">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <div class="lb-bar">
    <button class="lb-nav-btn" id="lbPrev" onclick="lbNav(-1)">‹</button>
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-nav-btn" id="lbNext" onclick="lbNav(1)">›</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg hidden" id="settingsModal">
  <div class="modal">
    <h2>⚙ 設定</h2>
    <div class="field">
      <label>施工者名（黒板に追加表示）</label>
      <input type="text" id="contractorInp" placeholder="例：○○工業株式会社">
    </div>
    <button class="modal-btn modal-save" onclick="saveSettings()">保存</button>
    <button class="modal-btn modal-cancel" onclick="closeSettings()">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileAlb" accept="image/*" onchange="onAlbumFile(event)">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── プリセット ──────────────────────────────────────────────────
const PRESETS = [

// ── DB ──────────────────────────────────────────────────────────
function openDB(){
  return new Promise((ok,ng)=>{
    const req=indexedDB.open('bbcam4',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('photos',{keyPath:'id'});
    req.onsuccess=e=>{db=e.target.result;ok();};
    req.onerror=ng;
  });
}
const dbPut=obj=>new Promise(ok=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(obj);tx.oncomplete=ok;});
const dbClear=()=>new Promise(ok=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=ok;});
const dbGetAll=()=>new Promise(ok=>{const r=db.transaction('photos','readonly').objectStore('photos').getAll();r.onsuccess=e=>ok(e.target.result||[]);});

// ── Storage ─────────────────────────────────────────────────────
const getPrefs=()=>JSON.parse(localStorage.getItem('bbcam_p')||'{}');
const setPrefs=p=>localStorage.setItem('bbcam_p',JSON.stringify(p));
const getProjects=()=>JSON.parse(localStorage.getItem('bbcam_proj')||'[]');
const saveProjects=p=>localStorage.setItem('bbcam_proj',JSON.stringify(p));

// ── Helpers ─────────────────────────────────────────────────────
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;};
const getName=()=>camName;
const getProc=()=>camProc;
const show=id=>document.getElementById(id).classList.remove('hidden');
const hide=id=>document.getElementById(id).classList.add('hidden');
const uid=()=>Date.now()+Math.random();

// ── HOME: 案件一覧 ───────────────────────────────────────────────
function renderProjects(){
  const projs=getProjects(), list=document.getElementById('projList');
  list.innerHTML='';
  if(!projs.length){show('projEmpty');return;}
  hide('projEmpty');
  projs.forEach(p=>{
    const totalProcs=p.groups.reduce((s,g)=>s+g.procs.length,0);
    const card=document.createElement('div'); card.className='proj-card';
    const info=document.createElement('div'); info.className='proj-info';
    info.innerHTML=`<div class="proj-name">${p.name}</div><div class="proj-sub">${p.groups.length}グループ・${totalProcs}工種</div>`;
    info.onclick=()=>openProject(p.id);
    const arrow=document.createElement('div'); arrow.className='proj-arrow'; arrow.textContent='›';
    arrow.onclick=()=>openProject(p.id);
    const del=document.createElement('button'); del.className='proj-del'; del.textContent='🗑';
    del.onclick=e=>{e.stopPropagation();deleteProject(p.id);};
    card.appendChild(info); card.appendChild(del); card.appendChild(arrow);
    list.appendChild(card);
  });
}

function addProject(){
  const name=prompt('案件名（工事件名）を入力してください');

  const projs=getProjects();
  projs.push({id:uid(), name:name.trim(), groups:[]});

}

function deleteProject(id){
  if(!confirm('この案件を削除しますか？')) return;
  saveProjects(getProjects().filter(p=>p.id!==id));

}

function renderProject(){

  document.getElementById('projTitle').textContent=proj.name;
  const list=document.getElementById('groupList'); list.innerHTML='';
  if(!proj.groups.length){show('groupEmpty');return;}
  hide('groupEmpty');
  proj.groups.forEach(g=>{
    const totalProcs=g.procs.length;
    const doneProcs=g.procs.filter(proc=>photos.some(p=>p.name===g.name&&p.proc===proc)).length;
    const totalPh=photos.filter(p=>p.name===g.name).length;
    const card=document.createElement('div'); card.className='proj-card';
    const info=document.createElement('div'); info.className='proj-info';
    info.innerHTML=`<div class="proj-name">${g.name}</div>
      <div class="proj-sub">${totalProcs}工種・<span style="color:#43A047">${doneProcs}種類撮影済</span>・${totalPh}枚</div>`;
    info.onclick=()=>openGroup(g.id);
    const editBtn=document.createElement('button'); editBtn.className='proj-del'; editBtn.textContent='✏';
    editBtn.onclick=e=>{e.stopPropagation();editGroup(g.id,'project');};
    const delBtn=document.createElement('button'); delBtn.className='proj-del'; delBtn.textContent='🗑';
    delBtn.onclick=e=>{e.stopPropagation();deleteGroup(g.id);};
    const arrow=document.createElement('div'); arrow.className='proj-arrow'; arrow.textContent='›';
    arrow.onclick=()=>openGroup(g.id);
    card.appendChild(info); card.appendChild(editBtn); card.appendChild(delBtn); card.appendChild(arrow);
    list.appendChild(card);
  });

function renderGroupDetail(){
  const proj=getProjects().find(p=>p.id===curProjId);
  const g=proj&&proj.groups.find(g=>g.id===curGroupId);
  if(!proj||!g) return;
  document.getElementById('gdTitle').textContent=g.name;
  const body=document.getElementById('gdBody'); body.innerHTML='';
  g.procs.forEach(proc=>{
    const procPhotos=photos.filter(p=>p.name===g.name&&p.proc===proc);
    const hasPh=procPhotos.length>0;
    const row=document.createElement('div'); row.className='proc-row';
    const top=document.createElement('div'); top.className='proc-row-top';
    const dot=document.createElement('div'); dot.className='proc-dot'+(hasPh?' done':'');
    const nm=document.createElement('span'); nm.className='proc-name'; nm.textContent=proc;
    const btn=document.createElement('button'); btn.className='shoot-btn'; btn.textContent='📷 撮影';
    btn.onclick=()=>shootWith(g.name,proc);
    top.appendChild(dot); top.appendChild(nm);
    if(hasPh){
      const cnt=document.createElement('span'); cnt.className='proc-cnt';
      cnt.textContent=`✓ ${procPhotos.length}枚`;
      top.appendChild(cnt);
    }
    top.appendChild(btn);
    row.appendChild(top);
    if(hasPh){
      const MAX=5;
      const thumbRow=document.createElement('div'); thumbRow.className='proc-thumbs';
      procPhotos.slice(0,MAX).forEach((ph,i)=>{
        const img=document.createElement('img'); img.className='proc-thumb';
        img.src=ph.dataUrl; img.loading='lazy';
        img.onclick=e=>{e.stopPropagation();showLightbox(procPhotos,i,proc);};
        thumbRow.appendChild(img);
      });
      if(procPhotos.length>MAX){
        const more=document.createElement('div'); more.className='proc-thumb-more';
        more.textContent=`+${procPhotos.length-MAX}`;
        more.onclick=()=>showLightbox(procPhotos,MAX,proc);
        thumbRow.appendChild(more);
      }
      row.appendChild(thumbRow);
    }
    body.appendChild(row);
  });
}

function makeProcListSortable(){
  const list=document.getElementById('procEditList');
  let dragging=null, lastOver=null;

  function getRows(){return [...list.querySelectorAll('.proc-edit-row')];}
  function clearOver(){getRows().forEach(r=>{r.classList.remove('drag-over-top','drag-over-bot');});}

  function onDragStart(e,row){
    dragging=row;
    row.classList.add('is-dragging');
  }

  function onDragMove(e){
    if(!dragging) return;
    e.preventDefault();
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    clearOver();
    const others=getRows().filter(r=>r!==dragging);
    let target=null, before=true;
    for(const r of others){
      const rect=r.getBoundingClientRect();
      const mid=rect.top+rect.height/2;
      if(clientY<mid){target=r;before=true;break;}
      if(clientY>=rect.top){target=r;before=false;}
    }
    if(target){target.classList.add(before?'drag-over-top':'drag-over-bot');lastOver={target,before};}
    else{lastOver=null;}
  }

  function onDragEnd(){
    if(!dragging) return;
    clearOver();
    dragging.classList.remove('is-dragging');
    if(lastOver){
      const {target,before}=lastOver;
      if(before) list.insertBefore(dragging,target);
      else target.insertAdjacentElement('afterend',dragging);
    }
    // sync geState.procs from DOM order
    geState.procs=getRows().map(r=>r.querySelector('.proc-edit-name').textContent);
    dragging=null; lastOver=null;
  }

  getRows().forEach(row=>{
    const handle=row.querySelector('.proc-drag-handle');
    handle.addEventListener('touchstart',e=>{e.preventDefault();onDragStart(e,row);},{passive:false});
    handle.addEventListener('mousedown',e=>{onDragStart(e,row);});
  });
  list.addEventListener('touchmove',onDragMove,{passive:false});
  list.addEventListener('touchend',onDragEnd);
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('mouseup',onDragEnd);
}

function saveGroup(){
  const name=document.getElementById('groupNameInp').value.trim();
  if(!name){toast('工事件名を入力してください');return;}
  if(!geState.procs.length){toast('工種を1つ以上追加してください');return;}
  const projs=getProjects();
  const proj=projs.find(p=>p.id===geState.projId);
  if(geState.groupId){
    const g=proj.groups.find(g=>g.id===geState.groupId);
    if(g){g.name=name;g.procs=geState.procs;}
  } else {
    proj.groups.push({id:uid(), name, procs:geState.procs});

  saveProjects(projs); toast('💾 保存しました');
  hide('sGroupEdit');
  if(geFrom==='groupDetail'&&geState.groupId){
    curGroupId=geState.groupId; renderGroupDetail(); show('sGroupDetail');
  } else {
    renderProject(); show('sProject');
  }
}

// ── DRAG ────────────────────────────────────────────────────────
function initDrag(){
  const el=document.getElementById('bbOv'),vf=document.getElementById('viewfinder');
  el.style.left='10px';el.style.bottom='10px';el.style.top='auto';el.style.right='auto';
  bbPos={xFrac:0.015,yFrac:null};
  if(_dragCleanup)_dragCleanup();
  const onMove=e=>{
    if(!_drag)return;e.preventDefault();
    const t=e.touches?e.touches[0]:e,vfR=vf.getBoundingClientRect();
    let nx=_drag.ex+(t.clientX-_drag.cx),ny=_drag.ey+(t.clientY-_drag.cy);
    nx=Math.max(0,Math.min(vfR.width-el.offsetWidth,nx));
    ny=Math.max(0,Math.min(vfR.height-el.offsetHeight,ny));
    el.style.left=nx+'px';el.style.top=ny+'px';el.style.bottom='auto';
    bbPos={xFrac:nx/vfR.width,yFrac:ny/vfR.height};
    _drag.cx=t.clientX;_drag.cy=t.clientY;_drag.ex=nx;_drag.ey=ny;
  };
  const onEnd=()=>{_drag=null;};
  const onStart=e=>{
    const t=e.touches?e.touches[0]:e,r=el.getBoundingClientRect(),vfR=vf.getBoundingClientRect();
    _drag={cx:t.clientX,cy:t.clientY,ex:r.left-vfR.left,ey:r.top-vfR.top};
  };
  el.addEventListener('touchstart',onStart,{passive:true});
  el.addEventListener('mousedown',onStart);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd);
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
  _dragCleanup=()=>{
    el.removeEventListener('touchstart',onStart);el.removeEventListener('mousedown',onStart);
    document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);
  };
}

async function startCam(){
  show('camVideo');hide('fallbackArea');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:1920},height:{ideal:1080}}});
    document.getElementById('camVideo').srcObject=stream;
  }catch(e){hide('camVideo');show('fallbackArea');}
}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  document.getElementById('camVideo').srcObject=null;
}
async function flipCam(){facingMode=facingMode==='environment'?'user':'environment';stopCam();await startCam();}

// ── SHOOT ────────────────────────────────────────────────────────
async function shoot(){
  const video=document.getElementById('camVideo');
  if(!video.srcObject||!video.videoWidth)return;
  triggerFlash(); await addPhoto(captureVideo(video));
}
function triggerFlash(){
  const f=document.getElementById('flash');
  f.style.animation='none';f.offsetHeight;f.style.animation='flashAnim .35s ease-out forwards';
}
function captureVideo(video){
  const w=video.videoWidth,h=video.videoHeight;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.drawImage(video,0,0,w,h);
  drawBlackboard(ctx,w,h);return c.toDataURL('image/jpeg',.90);
}
async function onCapFile(e){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  showLoader();
  try{const raw=await readFile(file),r=await resizeDataUrl(raw,1920);await addPhoto(await compositeBlackboard(r));}
  catch(err){toast('エラー: '+err.message);}
  hideLoader();
}
async function onAlbumFile(e){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  showLoader();
  try{const raw=await readFile(file),r=await resizeDataUrl(raw,1920);await addPhoto(await compositeBlackboard(r));toast('読み込みました');}
  catch(err){toast('エラー: '+err.message);}
  hideLoader();
}
async function addPhoto(dataUrl){
  const photo={id:uid(),dataUrl,proc:getProc(),name:getName(),date:todayStr()};
  photos.push(photo);await dbPut(photo);updateGalCount();
  autoSave(photo);toast(`📷 保存しました（${photos.length}枚目）`);
}
function autoSave(photo){
  const proc=photo.proc.replace(/[\\/:*?"<>|]/g,'_');
  const date=(photo.date||'').replace(/[年月]/g,'-').replace('日','');
  saveToDevice(photo.dataUrl,`IMG_${String(photos.length).padStart(3,'0')}_${proc}_${date}.jpg`);
}
function saveToDevice(dataUrl,filename){
  try{const a=document.createElement('a');a.href=dataUrl;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);}catch(e){}
}

// ── IMAGE UTILS ─────────────────────────────────────────────────
const readFile=f=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=e=>ok(e.target.result);r.onerror=ng;r.readAsDataURL(f);});
const resizeDataUrl=(d,m)=>new Promise(ok=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m;}else{w=Math.round(w*m/h);h=m;}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);ok(c.toDataURL('image/jpeg',.88));};i.src=d;});
const compositeBlackboard=d=>new Promise(ok=>{const i=new Image();i.onload=()=>{const w=i.width,h=i.height,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(i,0,0);drawBlackboard(ctx,w,h);ok(c.toDataURL('image/jpeg',.90));};i.src=d;});

// ── BLACKBOARD DRAW ──────────────────────────────────────────────
function drawBlackboard(ctx,cw,ch){
  const prefs=getPrefs();
  const kojiName=getName(),proc=getProc(),dateStr=todayStr();
  const bw=Math.round(cw*0.50), bh=Math.round(bw*3/4);
  const bx=bbPos.yFrac!==null?Math.round(cw*bbPos.xFrac):Math.round(cw*0.015);
  const by=bbPos.yFrac!==null?Math.round(ch*bbPos.yFrac):ch-bh-Math.round(ch*0.015);
  const lw=Math.round(bw*0.27), brd=Math.max(2,Math.round(cw*0.002));
  const testFs=Math.round(bh*0.13);
  ctx.font=`bold ${testFs}px Meiryo,sans-serif`;
  const maxValW=bw-lw-testFs*0.4;
  const nameWrap=ctx.measureText(kojiName).width>maxValW;
  const rows=[
    {lbl:'工事名',val:kojiName,wrap:nameWrap},
    prefs.contractor?{lbl:'施工者',val:prefs.contractor,wrap:false}:null,
    {lbl:'撮影日',val:dateStr,wrap:false},
  ].filter(Boolean);
  const sH=Math.round(bh*0.16);
  const totalH=rows.reduce((s,r)=>s+(r.wrap?sH*2:sH),0);
  const procH=bh-totalH;

  ctx.fillStyle='#1A5C1A';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#fff';ctx.lineWidth=brd*2;ctx.strokeRect(bx+brd,by+brd,bw-brd*2,bh-brd*2);

  let curY=by;
  rows.forEach((row,i)=>{
    const rh=row.wrap?sH*2:sH;
    if(i>0){ctx.strokeStyle='#fff';ctx.lineWidth=brd;ctx.beginPath();ctx.moveTo(bx,curY);ctx.lineTo(bx+bw,curY);ctx.stroke();}
    ctx.strokeStyle='#fff';ctx.lineWidth=brd;ctx.beginPath();ctx.moveTo(bx+lw,curY);ctx.lineTo(bx+lw,curY+rh);ctx.stroke();
    const fs=Math.round(sH*0.50);
    ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.textAlign='center';
    ctx.font=`${fs}px Meiryo,sans-serif`;ctx.fillText(row.lbl,bx+lw/2,curY+rh/2);
    ctx.textAlign='left';
    if(row.wrap){
      const wFs=Math.round(fs*0.85);ctx.font=`bold ${wFs}px Meiryo,sans-serif`;
      const chars=Array.from(row.val);
      let sp=Math.ceil(chars.length/2);
      while(sp<chars.length&&ctx.measureText(chars.slice(0,sp).join('')).width>maxValW)sp++;
      const l1=chars.slice(0,sp).join(''),l2=chars.slice(sp).join('');
      ctx.fillText(l1,bx+lw+wFs*0.2,curY+rh*0.32);ctx.fillText(l2,bx+lw+wFs*0.2,curY+rh*0.72);
    } else {
      ctx.font=`bold ${fs}px Meiryo,sans-serif`;
      let val=row.val;
      while(ctx.measureText(val).width>maxValW&&val.length>1)val=val.slice(0,-1);
      if(val!==row.val)val+='…';
      ctx.fillText(val,bx+lw+fs*0.2,curY+rh/2);
    }
    curY+=rh;
  });
  ctx.strokeStyle='#fff';ctx.lineWidth=brd;ctx.beginPath();ctx.moveTo(bx,curY);ctx.lineTo(bx+bw,curY);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  let pFs=Math.round(procH*0.30);ctx.font=`bold ${pFs}px Meiryo,sans-serif`;ctx.fillStyle='#fff';
  if(ctx.measureText(proc).width>bw*0.88){
    pFs=Math.round(procH*0.22);ctx.font=`bold ${pFs}px Meiryo,sans-serif`;
    const mid=Math.ceil(proc.length/2);
    ctx.fillText(proc.slice(0,mid),bx+bw/2,curY+procH*0.35);ctx.fillText(proc.slice(mid),bx+bw/2,curY+procH*0.68);
  } else {ctx.fillText(proc,bx+bw/2,curY+procH/2);}
}

// ── GALLERY ─────────────────────────────────────────────────────
function renderGallery(){
  const cnt=document.getElementById('galContent');
  document.getElementById('galTotal').textContent=photos.length;
  if(!photos.length){cnt.innerHTML='<div class="gal-empty"><span>📷</span><p>まだ写真がありません</p></div>';return;}
  const grid=document.createElement('div');grid.className='gal-grid';
  photos.slice().reverse().forEach(p=>{
    const div=document.createElement('div');div.className='gal-item';
    const img=document.createElement('img');img.src=p.dataUrl;img.loading='lazy';
    const proc=document.createElement('div');proc.className='gal-proc';proc.textContent=p.proc;
    const btn=document.createElement('div');btn.className='gal-dl';btn.textContent='⬇ 保存';
    btn.addEventListener('click',e=>{e.stopPropagation();dlPhoto(p);});
    div.appendChild(img);div.appendChild(proc);div.appendChild(btn);grid.appendChild(div);
  });
  cnt.innerHTML='';cnt.appendChild(grid);
}
function dlPhoto(p){
  const proc=p.proc.replace(/[\\/:*?"<>|]/g,'_');
  const date=(p.date||'').replace(/[年月]/g,'-').replace('日','');
  saveToDevice(p.dataUrl,`工事写真_${proc}_${date}.jpg`);toast('保存しました');
}
async function downloadAll(){
  if(!photos.length){toast('写真がありません');return;}
  if(typeof JSZip==='undefined'){photos.forEach(p=>dlPhoto(p));return;}
  showLoader('ZIPを作成中...');
  try{
    const zip=new JSZip();
    photos.forEach((p,i)=>{const proc=p.proc.replace(/[\\/:*?"<>|]/g,'_');zip.file(`${String(i+1).padStart(3,'0')}_${proc}.jpg`,p.dataUrl.split(',')[1],{base64:true});});
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`工事写真_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.zip`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);toast(`${photos.length}枚をZIPで保存しました`);
  }catch(e){toast('エラー: '+e.message);}
  hideLoader();
}
async function clearAll(){
  if(!photos.length){toast('写真がありません');return;}
  if(!confirm(`${photos.length}枚の写真を全て削除しますか？`))return;
  await dbClear();photos=[];updateGalCount();renderGallery();toast('全て削除しました');
}

// ── LIGHTBOX ─────────────────────────────────────────────────────
let lbPhotos=[], lbIdx=0;
function showLightbox(pArr, idx, proc){
  lbPhotos=pArr; lbIdx=idx;
  document.getElementById('lbProc').textContent=proc||'';
  updateLightbox();
  document.getElementById('lightbox').classList.remove('hidden');
}
function updateLightbox(){
  document.getElementById('lbImg').src=lbPhotos[lbIdx].dataUrl;
  document.getElementById('lbCount').textContent=`${lbIdx+1} / ${lbPhotos.length}`;
  document.getElementById('lbPrev').disabled=lbIdx===0;
  document.getElementById('lbNext').disabled=lbIdx===lbPhotos.length-1;
}
function closeLightbox(){document.getElementById('lightbox').classList.add('hidden');}
function lbNav(dir){lbIdx=Math.max(0,Math.min(lbPhotos.length-1,lbIdx+dir));updateLightbox();}

// ── SETTINGS ─────────────────────────────────────────────────────
function openSettings(){document.getElementById('contractorInp').value=getPrefs().contractor||'';show('settingsModal');}
function closeSettings(){hide('settingsModal');}
function saveSettings(){const p=getPrefs();p.contractor=document.getElementById('contractorInp').value.trim();setPrefs(p);closeSettings();toast('設定を保存しました');}

// ── TOAST / LOADER ───────────────────────────────────────────────
function toast(msg,dur=2800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);}
let loaderEl=null;
function showLoader(msg='処理中...'){if(loaderEl)return;loaderEl=document.createElement('div');loaderEl.className='loader';loaderEl.innerHTML=`<div class="spin"></div><span>${msg}</span>`;document.body.appendChild(loaderEl);}
function hideLoader(){if(loaderEl){loaderEl.remove();loaderEl=null;}}

init();
</script>
